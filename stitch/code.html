<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteHouse Presence Orb Animation</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #030305;
      --dark-green: #063b2a;
      --green: #19c37d;
      --blue: #20a9ff;
      --violet: #7c3aed;
      --pink: #ec4899;
      --rose-pink: #fb7185;
      --red: #ef3340;
      --white: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.12), transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(25, 195, 125, 0.08), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(32, 169, 255, 0.08), transparent 35%),
        var(--black);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* Ambient background grid dots */
    .bg-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* ================================
       BYTEHOUSE PRESENCE ORB
    ================================= */

    .bytehouse-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 320px;
    }

    .bytehouse {
      position: relative;
      width: 140px;
      height: 140px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.4s cubic-bezier(.22, 1, .36, 1);
      border-radius: 50%;
    }

    .bytehouse:hover {
      transform: scale(1.08);
    }

    .bytehouse:active {
      transform: scale(0.95);
    }

    /* Outer acoustic concentric rings */
    .sound-ring {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 1px solid rgba(124, 58, 237, 0.25);
      pointer-events: none;
      animation: ringExpand 3.2s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
    }
    .sound-ring:nth-child(2) {
      inset: -60px;
      border-color: rgba(32, 169, 255, 0.18);
      animation-delay: 1.1s;
    }
    .sound-ring:nth-child(3) {
      inset: -95px;
      border-color: rgba(236, 72, 153, 0.12);
      animation-delay: 2.2s;
    }

    @keyframes ringExpand {
      0% {
        transform: scale(0.85);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: scale(1.15);
        opacity: 0;
      }
    }

    /* ================================
       OUTER GLOW
    ================================= */

    .glow {
      position: absolute;
      inset: -45px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(32, 169, 255, 0.45),
          rgba(124, 58, 237, 0.32) 27%,
          rgba(236, 72, 153, 0.22) 46%,
          rgba(25, 195, 125, 0.14) 62%,
          transparent 74%
        );
      filter: blur(24px);
      pointer-events: none;
      animation: breathe 3.2s ease-in-out infinite;
    }

    /* ================================
       MAIN ORB
    ================================= */

    .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 34% 24%,
          var(--white) 0%,
          var(--blue) 7%,
          #1464a0 18%,
          var(--violet) 32%,
          var(--dark-green) 51%,
          var(--black) 73%
        );
      box-shadow:
        inset 10px 8px 24px rgba(255, 255, 255, 0.3),
        inset -18px -18px 36px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(32, 169, 255, 0.4),
        0 0 65px rgba(124, 58, 237, 0.28),
        0 0 95px rgba(236, 72, 153, 0.18);
      animation: orbFloat 4s ease-in-out infinite;
    }

    /* ================================
       MULTICOLOR ENERGY
    ================================= */

    .energy {
      position: absolute;
      width: 190px;
      height: 95px;
      left: -25px;
      top: 45px;
      border-radius: 50%;
      background:
        linear-gradient(
          90deg,
          var(--red) 0%,
          var(--rose-pink) 18%,
          var(--pink) 35%,
          var(--violet) 52%,
          var(--blue) 70%,
          var(--green) 88%,
          var(--dark-green) 100%
        );
      filter: blur(14px);
      opacity: 0.85;
      transform: rotate(-30deg);
      animation: energyMove 5s ease-in-out infinite;
    }

    .energy::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        linear-gradient(
          90deg,
          transparent,
          var(--blue),
          var(--violet),
          var(--pink),
          transparent
        );
      filter: blur(16px);
      opacity: 0.75;
      transform: rotate(65deg);
    }

    /* ================================
       GREEN ENERGY SPOT
    ================================= */

    .orb::before {
      content: "";
      position: absolute;
      width: 75px;
      height: 75px;
      right: -12px;
      bottom: 6px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(25, 195, 125, 0.88),
          rgba(6, 59, 42, 0.48),
          transparent 70%
        );
      filter: blur(8px);
      animation: greenPulse 3s ease-in-out infinite;
    }

    /* ================================
       RED / ROSE ENERGY
    ================================= */

    .orb::after {
      content: "";
      position: absolute;
      width: 85px;
      height: 42px;
      left: -12px;
      bottom: 8px;
      border-radius: 50%;
      background:
        linear-gradient(
          90deg,
          rgba(239, 51, 64, 0.76),
          rgba(251, 113, 133, 0.58),
          transparent
        );
      filter: blur(10px);
      transform: rotate(-25deg);
      animation: redEnergy 4s ease-in-out infinite;
    }

    /* ================================
       CENTRAL WHITE LIGHT
    ================================= */

    .light {
      position: absolute;
      width: 42px;
      height: 42px;
      top: 30px;
      left: 48px;
      border-radius: 50%;
      background: var(--white);
      box-shadow:
        0 0 12px var(--white),
        0 0 28px var(--blue),
        0 0 45px var(--blue),
        0 0 70px var(--violet),
        0 0 90px var(--pink);
      animation: lightMove 4s ease-in-out infinite;
    }

    /* ================================
       WHITE HIGHLIGHT
    ================================= */

    .highlight {
      position: absolute;
      width: 38px;
      height: 18px;
      top: 15px;
      left: 28px;
      border-radius: 50%;
      background:
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.3),
          transparent
        );
      filter: blur(3px);
      transform: rotate(-25deg);
    }

    /* ================================
       BASE ANIMATIONS
    ================================= */

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.94);
        opacity: 0.65;
      }
      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes energyMove {
      0% {
        transform: rotate(-30deg) translateX(-12px);
      }
      50% {
        transform: rotate(25deg) translateX(18px);
      }
      100% {
        transform: rotate(-30deg) translateX(-12px);
      }
    }

    @keyframes lightMove {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(14px, 8px) scale(1.22);
      }
    }

    @keyframes greenPulse {
      0%, 100% {
        transform: scale(0.85);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.25);
        opacity: 0.95;
      }
    }

    @keyframes redEnergy {
      0%, 100% {
        transform: rotate(-25deg) translateX(0);
      }
      50% {
        transform: rotate(15deg) translateX(14px);
      }
    }

    /* ================================
       LISTENING STATE
    ================================= */

    .bytehouse.listening .orb {
      animation:
        orbFloat 2s ease-in-out infinite,
        listeningPulse 1s ease-in-out infinite;
    }

    .bytehouse.listening .glow {
      animation: listeningGlow 1s ease-in-out infinite;
    }

    .bytehouse.listening .light {
      box-shadow:
        0 0 14px var(--white),
        0 0 32px var(--blue),
        0 0 58px var(--green),
        0 0 90px var(--blue);
    }

    @keyframes listeningPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes listeningGlow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.65;
      }
      50% {
        transform: scale(1.4);
        opacity: 1;
      }
    }

    /* ================================
       THINKING STATE
    ================================= */

    .bytehouse.thinking .energy {
      animation: thinkingEnergy 1.2s linear infinite;
    }

    .bytehouse.thinking .light {
      animation: thinkingLight 1s ease-in-out infinite;
    }

    .bytehouse.thinking .glow {
      animation: thinkingGlow 1.8s ease-in-out infinite;
    }

    @keyframes thinkingEnergy {
      from {
        transform: rotate(0deg) scale(1.12);
      }
      to {
        transform: rotate(360deg) scale(1.12);
      }
    }

    @keyframes thinkingLight {
      0%, 100% {
        transform: translate(-7px, 0) scale(1);
      }
      50% {
        transform: translate(14px, -7px) scale(1.3);
      }
    }

    @keyframes thinkingGlow {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.95);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-grid flex flex-col justify-between items-center p-8 select-none">

  <!-- Top bar info -->
  <header class="w-full max-w-5xl flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <span class="text-xs font-semibold tracking-widest uppercase text-white/70">ByteHouse Neural Presence</span>
    </div>

    <!-- Mode Badges -->
    <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 backdrop-blur-md">
      <button id="btn-idle" onclick="forceState('idle')" class="state-btn px-3 py-1 rounded-full text-xs font-medium transition-all text-white/50 hover:text-white">IDLE</button>
      <button id="btn-listening" onclick="forceState('listening')" class="state-btn px-3 py-1 rounded-full text-xs font-medium transition-all text-white/50 hover:text-white">LISTENING</button>
      <button id="btn-thinking" onclick="forceState('thinking')" class="state-btn px-3 py-1 rounded-full text-xs font-medium transition-all bg-white/20 text-white shadow">THINKING</button>
    </div>
  </header>

  <!-- Center Orb Showcase -->
  <main class="flex flex-col items-center justify-center my-auto z-10 text-center">
    
    <div class="bytehouse-stage">
      <!-- Concentric soundwave halos -->
      <div class="sound-ring"></div>
      <div class="sound-ring"></div>
      <div class="sound-ring"></div>

      <!-- ByteHouse Orb -->
      <div class="bytehouse thinking" id="bytehouse" role="button" tabindex="0" aria-label="ByteHouse assistant">
        <div class="glow"></div>
        <div class="orb">
          <div class="energy"></div>
          <div class="light" style="width: 24px; height: 24px; top: 40px; left: 56px; transform-origin: 50% -36px 0px; box-shadow: rgb(255, 255, 255) 0px 0px 8px, rgb(32, 169, 255) 0px 0px 18px, rgb(32, 169, 255) 0px 0px 30px, rgb(124, 58, 237) 0px 0px 45px, rgb(236, 72, 153) 0px 0px 60px; animation: 3.6s ease-in-out infinite pendulumIdle;"><style>@keyframes pendulumIdle { 0% { transform: rotate(-18deg) translate(-14px, -3px); } 50% { transform: rotate(18deg) translate(14px, -3px); } 100% { transform: rotate(-18deg) translate(-14px, -3px); } } .bytehouse.listening .light { animation: pendulumListening 2.2s ease-in-out infinite !important; } @keyframes pendulumListening { 0% { transform: rotate(-26deg) translate(-20px, -6px) scale(1.08); } 50% { transform: rotate(26deg) translate(20px, -6px) scale(1.08); } 100% { transform: rotate(-26deg) translate(-20px, -6px) scale(1.08); } } .bytehouse.thinking .light { animation: pendulumThinking 1.4s ease-in-out infinite !important; } @keyframes pendulumThinking { 0% { transform: rotate(-32deg) translate(-22px, -8px) scale(1.12); } 25% { transform: rotate(0deg) translate(0px, 8px) scale(1.18); } 50% { transform: rotate(32deg) translate(22px, -8px) scale(1.12); } 75% { transform: rotate(0deg) translate(0px, 8px) scale(1.18); } 100% { transform: rotate(-32deg) translate(-22px, -8px) scale(1.12); } }</style></div>
          <div class="highlight"></div>
        </div>
      </div>
    </div>

    <!-- State readout & caption -->
    <div class="mt-6 flex flex-col items-center">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-fuchsia-500/10 border border-fuchsia-500/30 text-xs font-mono tracking-widest text-pink-300 uppercase shadow-inner" id="status-badge">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span id="status-text" class="">STATE: THINKING</span>
      </div>
      <p class="text-white/40 text-xs mt-3 max-w-sm tracking-wide">
        Click or press <kbd class="px-1.5 py-0.5 rounded bg-white/10 text-white/80 font-mono text-[11px]">Space</kbd> to cycle states (Idle → Listening → Thinking)
      </p>
    </div>

  </main>

  <!-- Bottom Interactive controls -->
  <footer class="w-full max-w-xl z-20 flex flex-col items-center gap-3">
    <div class="w-full flex items-center justify-between px-5 py-3 rounded-2xl bg-white/[0.04] border border-white/10 backdrop-blur-xl">
      <div class="flex items-center gap-3 text-white/80 text-xs">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <span class="">CSS Multi-Layer Spectrum Dynamics</span>
      </div>
      <span class="text-[11px] font-mono text-white/40">60 FPS Native GL/CSS</span>
    </div>
  </footer>

  <script>
    const bytehouse = document.getElementById("bytehouse");
    const statusText = document.getElementById("status-text");
    const statusBadge = document.getElementById("status-badge");
    const stateBtns = {
      idle: document.getElementById("btn-idle"),
      listening: document.getElementById("btn-listening"),
      thinking: document.getElementById("btn-thinking"),
    };

    const states = ["idle", "listening", "thinking"];
    let currentState = 0;

    function setState(state) {
      bytehouse.classList.remove("listening", "thinking");
      if (state !== "idle") {
        bytehouse.classList.add(state);
      }

      statusText.textContent = "STATE: " + state.toUpperCase();

      // Update badge color
      if (state === "idle") {
        statusBadge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-mono tracking-widest text-emerald-400 uppercase shadow-inner";
      } else if (state === "listening") {
        statusBadge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-xs font-mono tracking-widest text-cyan-300 uppercase shadow-inner";
      } else if (state === "thinking") {
        statusBadge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-fuchsia-500/10 border border-fuchsia-500/30 text-xs font-mono tracking-widest text-pink-300 uppercase shadow-inner";
      }

      // Update toggle buttons
      Object.keys(stateBtns).forEach(s => {
        if (s === state) {
          stateBtns[s].className = "state-btn px-3 py-1 rounded-full text-xs font-medium transition-all bg-white/20 text-white shadow";
        } else {
          stateBtns[s].className = "state-btn px-3 py-1 rounded-full text-xs font-medium transition-all text-white/50 hover:text-white";
        }
      });
    }

    function forceState(stateName) {
      const idx = states.indexOf(stateName);
      if (idx !== -1) {
        currentState = idx;
        setState(stateName);
      }
    }

    function nextState() {
      currentState = (currentState + 1) % states.length;
      setState(states[currentState]);
    }

    bytehouse.addEventListener("click", nextState);

    bytehouse.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        nextState();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" && document.activeElement !== bytehouse && document.activeElement.tagName !== "INPUT") {
        event.preventDefault();
        nextState();
      }
    });
  </script>




</body></html>
