<style data-purpose="liquid-glass-effects">
    /* Ultra-luminous crystal light liquid glassmorphism with elegant Tailwind blue undertones */
    .liquid-window {
      background: linear-gradient(
        142deg,
        rgba(255, 255, 255, 0.72) 0%,
        rgba(238, 246, 255, 0.48) 42%,
        rgba(224, 242, 254, 0.52) 100%
      );
      backdrop-filter: blur(48px) saturate(190%) contrast(102%);
      -webkit-backdrop-filter: blur(48px) saturate(190%) contrast(102%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        inset 0 1.5px 3px 0 rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2px 0 rgba(186, 230, 253, 0.4),
        0 24px 60px -12px rgba(14, 60, 105, 0.16),
        0 0 45px -5px rgba(186, 230, 253, 0.35);
      position: relative;
    }

    /* Prismatic liquid sheen overlay with gentle shifting light reflection */
    .liquid-window::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--liquid-x, 25%) var(--liquid-y, 0%),
        rgba(255, 255, 255, 0.75) 0%,
        rgba(219, 234, 254, 0.4) 30%,
        rgba(224, 242, 254, 0.15) 55%,
        transparent 75%
      );
      pointer-events: none;
      animation: ambientLightBreathe 10s ease-in-out infinite alternate;
      will-change: opacity, transform;
    }

    /* Traveling specular gleaming perimeter with blue/cyan refraction */
    .perimeter-shimmer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.2px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 20%,
        rgba(255, 255, 255, 0.95) 45%,
        rgba(125, 211, 252, 0.9) 50%,
        rgba(199, 210, 254, 0.85) 55%,
        transparent 80%,
        transparent 100%
      );
      background-size: 250% 250%;
      animation: borderSweep 8s linear infinite;
      opacity: 0.9;
    }

    /* Refined inner card with crisp blue-frosted glass */
    .liquid-card {
      background: linear-gradient(
        138deg,
        rgba(255, 255, 255, 0.78) 0%,
        rgba(240, 247, 255, 0.58) 55%,
        rgba(224, 242, 254, 0.6) 100%
      );
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        inset 0 1.5px 2.5px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(191, 219, 254, 0.45),
        0 14px 34px -4px rgba(15, 60, 100, 0.07);
      position: relative;
    }

    /* Living Sunlight-Through-Water Caustic Layer */
    .caustic-fluid-layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      overflow: hidden;
      mix-blend-mode: soft-light;
      opacity: 0.55;
    }

    .caustic-mesh-1, .caustic-mesh-2 {
      position: absolute;
      inset: -50%;
      background: 
        radial-gradient(ellipse 55% 45% at 30% 30%, rgba(56, 189, 248, 0.32) 0%, transparent 60%),
        radial-gradient(ellipse 45% 45% at 75% 65%, rgba(96, 165, 250, 0.25) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 50%);
      filter: url(#liquid-caustic-filter) contrast(135%) brightness(112%);
      animation: liquidDrift 16s ease-in-out infinite alternate;
      will-change: transform;
    }

    .caustic-mesh-2 {
      animation: liquidDriftReverse 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      mix-blend-mode: overlay;
      opacity: 0.45;
    }

    /* Sunlight water reflection ripple sweep */
    .fluid-shimmer-sweep {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        125deg,
        transparent 20%,
        rgba(255, 255, 255, 0.22) 38%,
        rgba(186, 230, 253, 0.38) 48%,
        rgba(255, 255, 255, 0.45) 52%,
        transparent 65%
      );
      background-size: 200% 200%;
      animation: fluidSweep 7.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Polished Light Glass Pill Controls with soft blue radiance */
    .glass-pill {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.85) 0%,
        rgba(240, 247, 255, 0.62) 100%
      );
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        inset 0 1px 1.5px rgba(255, 255, 255, 0.98),
        inset 0 -0.5px 1px rgba(186, 230, 253, 0.45),
        0 4px 14px rgba(15, 45, 80, 0.07);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .glass-pill:hover {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(224, 242, 254, 0.8) 100%
      );
      border-color: rgba(255, 255, 255, 1);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 1),
        0 6px 18px rgba(14, 116, 144, 0.12);
    }

    .glass-pill::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      opacity: 0.4;
      pointer-events: none;
      animation: capsuleShimmer 6s ease-in-out infinite;
    }

    /* Light Liquid Glass Send Button with Sky Glow */
    .send-btn-liquid {
      background: linear-gradient(
        135deg,
        #38bdf8 0%,
        #0284c7 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 
        inset 0 1px 1.5px rgba(255, 255, 255, 0.6),
        inset 0 -1px 1.5px rgba(3, 105, 161, 0.5),
        0 4px 12px rgba(2, 132, 199, 0.32);
      position: relative;
      overflow: hidden;
    }

    .send-btn-liquid::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 40% 25%, rgba(255, 255, 255, 0.6) 0%, transparent 60%);
      animation: ambientPulse 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Interactive Prompt Action Chip Cards */
    .prompt-chip {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.7) 0%,
        rgba(240, 249, 255, 0.45) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 
        inset 0 1px 1.5px rgba(255, 255, 255, 0.9),
        0 2px 8px rgba(14, 116, 144, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .prompt-chip:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(224, 242, 254, 0.7) 100%
      );
      border-color: rgba(186, 230, 253, 0.85);
      transform: translateY(-1px);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 1),
        0 4px 14px rgba(14, 116, 144, 0.1);
    }

    /* Vibrant Pearl Iridescent Spectrum Orb */
    .orb-glow {
      background: conic-gradient(
        from 180deg at 50% 50%,
        #38bdf8 0deg,
        #60a5fa 70deg,
        #a78bfa 140deg,
        #38bdf8 210deg,
        #34d399 280deg,
        #38bdf8 360deg
      );
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
    }

    /* Fluid Caustic Keyframes */
    @keyframes liquidDrift {
      0% { transform: translate3d(-3%, -3%, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(4%, 3%, 0) scale(1.08) rotate(3deg); }
      100% { transform: translate3d(-2%, 5%, 0) scale(1.02) rotate(-2deg); }
    }

    @keyframes liquidDriftReverse {
      0% { transform: translate3d(3%, 4%, 0) scale(1.05) rotate(0deg); }
      50% { transform: translate3d(-4%, -2%, 0) scale(0.98) rotate(-4deg); }
      100% { transform: translate3d(2%, -4%, 0) scale(1.06) rotate(2deg); }
    }

    @keyframes borderSweep {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    @keyframes fluidSweep {
      0% { background-position: -120% -120%; opacity: 0.2; }
      40% { opacity: 0.6; }
      70% { opacity: 0.3; }
      100% { background-position: 180% 180%; opacity: 0.2; }
    }

    @keyframes capsuleShimmer {
      0% { background-position: -200% 0; }
      50%, 100% { background-position: 200% 0; }
    }

    @keyframes ambientLightBreathe {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes ambientPulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .caustic-mesh-1,
      .caustic-mesh-2,
      .perimeter-shimmer,
      .fluid-shimmer-sweep,
      .glass-pill::after,
      .liquid-window::before,
      .send-btn-liquid::after {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>
<!-- END: CSS Styles -->
</head>
<body class="relative min-h-screen w-full bg-[#e8f1f7] font-sans antialiased text-slate-800 flex items-center justify-center p-3 sm:p-6 overflow-hidden select-none">
<!-- BEGIN: Procedural Caustics Displacement Filter -->
<svg aria-hidden="true" class="hidden" height="0" width="0">
<defs>
<filter height="140%" id="liquid-caustic-filter" width="140%" x="-20%" y="-20%">
<feturbulence basefrequency="0.024 0.038" numoctaves="3" result="noise" seed="4" type="fractalNoise">
<animate attributename="baseFrequency" dur="18s" repeatcount="indefinite" values="0.024 0.038; 0.032 0.022; 0.02 0.035; 0.024 0.038"></animate>
</feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="22" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
</defs>
</svg>
<!-- END: Procedural Caustics Displacement Filter -->
<!-- BEGIN: Background Nature Layer (Bright & Sun-dappled with Blue Tint) -->

<!-- BEGIN: Interactive Polish Scripts -->
<script data-purpose="interactive-state">
    // Interactive cursor/touch-based specular light tracking
    const mainShell = document.querySelector('main');
    if (mainShell) {
      window.addEventListener('pointermove', (e) => {
        const rect = mainShell.getBoundingClientRect();
        const xPercent = Math.min(Math.max(((e.clientX - rect.left) / rect.width) * 100, 0), 100);
        const yPercent = Math.min(Math.max(((e.clientY - rect.top) / rect.height) * 100, 0), 100);
        mainShell.style.setProperty('--liquid-x', `${xPercent}%`);
        mainShell.style.setProperty('--liquid-y', `${yPercent}%`);
      });
    }

    // Smooth click interactions for prompt chips
    document.querySelectorAll('.prompt-chip').forEach((item) => {
      item.addEventListener('click', () => {
        const promptText = item.querySelector('span:last-child').innerText.replace(/^"|"$/g, '').trim();
        const input = document.querySelector('input[type="text"]');
        if (input) {
          input.value = promptText;
          input.focus();
        }
      });
    });
  </script>
<!-- END: Interactive Polish Scripts -->
</body></html>
